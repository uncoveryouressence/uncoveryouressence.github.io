<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<title>Uncover Your Essence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --brand: #101036;
    --brand-soft: #1F1B5C;
    --brand-accent: #FFD447;
    --brand-coral: #F26B5E;
    --ink: #101036;
    --ink-soft: #4A4868;
    --bg: #FAFAFC;
    --card: #FFFFFF;
    --border: rgba(16, 16, 54, 0.10);
    --shadow: 0 6px 28px rgba(16, 16, 54, 0.08);
    --shadow-lg: 0 14px 50px rgba(16, 16, 54, 0.16);
    --display-font: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --body-font: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  html, body {
    font-family: var(--body-font);
    color: var(--ink);
    line-height: 1.65;
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
  }

  .display {
    font-family: var(--display-font);
    letter-spacing: -0.01em;
    text-transform: uppercase;
    font-weight: 800;
  }

  
  .landing {
    flex: 1;
    position: relative;
    color: white;
    padding: 40px 24px;
    text-align: center;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(180deg, rgba(16, 16, 54, 0.82) 0%, rgba(16, 16, 54, 0.94) 100%),
      url('images/Letters.jpg') center/cover no-repeat;
  }

  .landing-inner {
    position: relative;
    z-index: 2;
    max-width: 1000px;
    width: 100%;
    margin: 0 auto;
  }

  .hero-logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 18px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  .hero-logo img { width: 100%; height: 100%; object-fit: cover; }

  .hero-eyebrow {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 18px;
    border: 1.5px solid var(--brand-accent);
    color: var(--brand-accent);
  }

  h1.display {
    font-size: clamp(2.2rem, 5.2vw, 4rem);
    line-height: 1;
    margin-bottom: 18px;
    text-shadow: 0 4px 30px rgba(0,0,0,0.3);
  }
  h1 .accent { color: var(--brand-accent); }

  .tagline {
    font-size: clamp(1.05rem, 1.8vw, 1.25rem);
    font-weight: 300;
    max-width: 720px;
    margin: 0 auto 36px;
    opacity: 0.95;
  }

  .report-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px;
    max-width: 820px;
    margin: 0 auto;
  }

  .report-card {
    position: relative;
    background: rgba(255, 255, 255, 0.05);
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    padding: 26px 28px 22px;
    text-align: left;
    color: white;
    text-decoration: none;
    backdrop-filter: blur(6px);
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    overflow: hidden;
  }
  .report-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255, 212, 71, 0.0) 0%, rgba(255, 212, 71, 0.08) 100%);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .report-card:not(.report-card--disabled):hover {
    transform: translateY(-4px);
    border-color: var(--brand-accent);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }
  .report-card:not(.report-card--disabled):hover::before { opacity: 1; }

  .report-card--disabled {
    opacity: 0.72;
    cursor: not-allowed;
  }

  .report-card--disabled .report-cta {
    color: rgba(255, 255, 255, 0.72);
  }

  .report-year {
    font-family: var(--display-font);
    font-weight: 800;
    font-size: clamp(2.6rem, 6vw, 3.6rem);
    line-height: 1;
    color: var(--brand-accent);
    margin-bottom: 10px;
    letter-spacing: -0.02em;
  }
  .report-title {
    font-family: var(--display-font);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: 1rem;
    margin-bottom: 8px;
  }
  .report-meta {
    font-size: 0.88rem;
    opacity: 0.78;
    margin-bottom: 18px;
    font-weight: 400;
  }
  .report-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--brand-accent);
    position: relative;
    z-index: 1;
  }
  .report-cta svg {
    width: 14px;
    height: 14px;
    transition: transform 0.25s ease;
  }
  .report-card:not(.report-card--disabled):hover .report-cta svg { transform: translateX(4px); }

  @media (min-width: 541px) {
    .report-card--disabled { order: -1; }
  }

  @media (max-width: 540px) {
    .landing { padding: 30px 20px; }
    .tagline { margin-bottom: 24px; }
    .report-card { padding: 22px 20px; }
  }
</style>
</head>
<body>

<main class="landing">
  <div class="landing-inner">
    <div class="hero-logo">
      <img src="images/logo.png" alt="UYE Logo">
    </div>
    <span class="hero-eyebrow">Uncover Your Essence</span>
    <h1 class="display">Conference<br><span class="accent">Reports &amp; Plans</span></h1>
    <p class="tagline">A look at the difference we made together.</p>

    <div class="report-grid">
      <a class="report-card" href="/2026/">
        <div class="report-year">2026</div>
        <div class="report-title">Second Annual Conference</div>
        <div class="report-meta">April 20, 2026 &middot; Halifax Convention Centre</div>
        <span class="report-cta">
          View Report
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </span>
      </a>

      <div class="report-card report-card--disabled" aria-disabled="true">
        <div class="report-year">2025</div>
        <div class="report-title">Inaugural Conference</div>
        <div class="report-meta">April 15, 2025 &middot; Halifax Convention Centre</div>
        <span class="report-cta">Report Coming Soon</span>
      </div>
    </div>
  </div>
</main>

</body>
</html>
